<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Mesajlar</title>
  <link rel="stylesheet" href="toast.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; height: 100vh; }

    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid #ff007f;
      object-fit: cover;
    }

    .header-username {
      font-weight: bold;
      font-size: 15px;
    }

    .messages-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.sent {
      align-self: flex-end;
      background: #ff007f;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.received {
      align-self: flex-start;
      background: #222;
      color: white;
      border-bottom-left-radius: 4px;
    }

    .chat-input-area {
      padding: 12px 15px;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
      background: #000;
    }

    .chat-input {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 10px 16px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #ff007f;
    }

    .send-btn {
      background: #ff007f;
      border: none;
      color: white;
      padding: 0 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="chat-header">
    <button class="back-btn" onclick="history.back()">←</button>
    <img id="chatAvatar" src="https://ui-avatars.com/api/?background=ff007f&color=fff&name=User" class="header-avatar">
    <span id="chatUsername" class="header-username">Yükleniyor...</span>
  </div>

  <div class="messages-container" id="messagesContainer"></div>

  <form class="chat-input-area" id="chatForm" onsubmit="sendMessage(event)">
    <input type="text" id="messageInput" class="chat-input" placeholder="Mesaj yazın..." autocomplete="off">
    <button type="submit" class="send-btn">Gönder</button>
  </form>

  <script src="notification-listener.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) window.location.href = "auth.html";

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid');

    if (!targetUid) {
      alert("Geçersiz sohbet!");
      window.location.href = "index.html";
    }

    // İki kullanıcı id'sinden benzersiz bir sohbet oda ID'si üretme (alfabetik sıralama ile)
    const chatId = [currentUser.uid, targetUid].sort().join("_");
    let targetUserData = null;

    async function initChat() {
      // 1. Hedef Kullanıcı Bilgilerini Çek
      const targetDoc = await db.collection("users").doc(targetUid).get();
      
      // HATA DÜZELTMESİ: targetDoc.exists parantezsiz kontrol edildi
      if (!targetDoc.exists) {
        alert("Kullanıcı bulunamadı!");
        window.location.href = "index.html";
        return;
      }

      targetUserData = targetDoc.data();
      const defaultAvatar = `https://ui-avatars.com/api/?background=ff007f&color=fff&name=${encodeURIComponent(targetUserData.username || 'User')}`;
      
      document.getElementById('chatUsername').innerText = `@${targetUserData.username || 'kullanici'}`;
      
      // Kapanan via.placeholder kontrolü ve ui-avatars düşürmesi
      const avatarUrl = (targetUserData.avatar && !targetUserData.avatar.includes('via.placeholder.com')) ? targetUserData.avatar : defaultAvatar;
      document.getElementById('chatAvatar').src = avatarUrl;

      // 2. Canlı Mesaj Dinleyicisi (Real-time Listener)
      db.collection("chats")
        .doc(chatId)
        .collection("messages")
        .orderBy("timestamp", "asc")
        .onSnapshot(snapshot => {
          const container = document.getElementById('messagesContainer');
          container.innerHTML = "";

          snapshot.forEach(doc => {
            const msg = doc.data();
            const msgEl = document.createElement('div');
            msgEl.className = `message ${msg.senderUid === currentUser.uid ? 'sent' : 'received'}`;
            msgEl.innerText = msg.text;
            container.appendChild(msgEl);
          });

          // Otomatik en aşağı kaydır
          container.scrollTop = container.scrollHeight;
        });
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (!text) return;
      input.value = "";

      const msgData = {
        senderUid: currentUser.uid,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };

      // 1. Mesajı veritabanına ekle
      await db.collection("chats").doc(chatId).collection("messages").add(msgData);

      // 2. Bildirim dokümanı oluştur (Toast/Notification Listener için)
      await db.collection("notifications").add({
        targetUid: targetUid,
        senderUid: currentUser.uid,
        senderName: currentUser.username || 'Bir kullanıcı',
        senderAvatar: currentUser.avatar || `https://ui-avatars.com/api/?background=ff007f&color=fff&name=${encodeURIComponent(currentUser.username || 'U')}`,
        messageText: text,
        read: false,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    initChat();
  </script>
</body>
</html>

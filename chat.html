<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Sohbet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; display: flex; flex-direction: column; }

    .chat-header {
      height: 60px;
      background: #121212;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 12px;
    }
    .back-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .header-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid #ff007f; }
    .header-user-info { display: flex; flex-direction: column; }
    .header-username { font-weight: bold; font-size: 15px; }
    .header-status { font-size: 11px; color: #888; }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #050505;
    }

    .message-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .message-bubble.sent {
      align-self: flex-end;
      background: #ff007f;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message-bubble.received {
      align-self: flex-start;
      background: #1e1e1e;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .blocked-notice {
      padding: 15px;
      text-align: center;
      background: #1a1a1a;
      color: #ff4757;
      font-size: 13px;
      border-top: 1px solid #222;
      display: none;
    }

    .chat-input-area {
      padding: 12px 15px;
      background: #121212;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
    }
    .chat-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 10px 15px;
      color: white;
      outline: none;
      font-size: 14px;
    }
    .chat-input:focus { border-color: #ff007f; }
    .send-msg-btn { background: #ff007f; color: white; border: none; padding: 0 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="chat-header">
    <button class="back-btn" onclick="history.back()">←</button>
    <img id="targetAvatar" src="https://via.placeholder.com/150" class="header-avatar">
    <div class="header-user-info">
      <span id="targetUsername" class="header-username">Yükleniyor...</span>
      <span class="header-status">Sohbet</span>
    </div>
  </div>

  <div class="messages-container" id="messagesContainer"></div>

  <div class="blocked-notice" id="blockedNotice">
    🔒 Mesajlaşabilmek için birbirinizi karşılıklı takip etmelisiniz!
  </div>

  <div class="chat-input-area" id="inputArea">
    <input type="text" id="messageInput" class="chat-input" placeholder="Mesaj yaz...">
    <button class="send-msg-btn" onclick="sendMessage()">Gönder</button>
  </div>

  <script>
    const VAPID_KEY = "BURAYA_KOPYALADIGIN_KEY_PAIR_GELECEK"; // Firebase Push Certificate Key

    let currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) window.location.href = "auth.html";

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid');

    if (!targetUid) window.location.href = "index.html";

    const chatId = [currentUser.uid, targetUid].sort().join('_');
    let targetUser = null;
    let isMutual = false;

    // Bildirim İznini Al ve Token Kaydet
    async function setupNotifications() {
      try {
        const messaging = firebase.messaging();
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const token = await messaging.getToken({ vapidKey: VAPID_KEY });
          if (token) {
            await db.collection("users").doc(currentUser.uid).update({ fcmToken: token });
          }
        }
      } catch (err) {
        console.log("Bildirim izni alınamadı:", err);
      }
    }

    // Karşılıklı Takip Kontrolü & Sohbet Başlatma
    async function initChat() {
      // Hedef kullanıcı bilgilerini al
      const targetDoc = await db.collection("users").doc(targetUid).get();
      if (!targetDoc.exists()) return;
      targetUser = targetDoc.data();

      document.getElementById('targetUsername').innerText = targetUser.username;
      document.getElementById('targetAvatar').src = targetUser.avatar || 'https://via.placeholder.com/150';

      // 1. Ben onu takip ediyor muyum?
      const myFollow = await db.collection("users").doc(currentUser.uid).collection("following").doc(targetUid).get();
      // 2. O beni takip ediyor mu?
      const targetFollow = await db.collection("users").doc(targetUid).collection("following").doc(currentUser.uid).get();

      isMutual = myFollow.exists() && targetFollow.exists();

      if (!isMutual) {
        document.getElementById('inputArea').style.display = 'none';
        document.getElementById('blockedNotice').style.display = 'block';
      } else {
        listenMessages();
      }

      setupNotifications();
    }

    // Mesajları Canlı Dinleme
    function listenMessages() {
      db.collection("chats").doc(chatId).collection("messages")
        .orderBy("createdAt", "asc")
        .onSnapshot(snapshot => {
          const container = document.getElementById('messagesContainer');
          container.innerHTML = "";

          snapshot.forEach(doc => {
            const msg = doc.data();
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${msg.senderUid === currentUser.uid ? 'sent' : 'received'}`;
            bubble.innerText = msg.text;
            container.appendChild(bubble);
          });

          container.scrollTop = container.scrollHeight;
        });
    }

    // Mesaj Gönderme
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (!text || !isMutual) return;
      input.value = "";

      // 1. Mesajı Veritabanına Ekle
      await db.collection("chats").doc(chatId).collection("messages").add({
        senderUid: currentUser.uid,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // 2. Bildirim kaydı oluştur (Sayfalar arası bildirim pop-up'ı ve push için)
      await db.collection("notifications").add({
        targetUid: targetUid,
        senderUid: currentUser.uid,
        senderName: currentUser.username,
        senderAvatar: currentUser.avatar || 'https://via.placeholder.com/150',
        messageText: text,
        type: 'chat',
        chatId: chatId,
        read: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    // Enter tuşuyla mesaj gönderme
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    initChat();
  </script>
</body>
</html>

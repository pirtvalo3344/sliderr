<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Profil</title>
  <link rel="stylesheet" href="toast.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 70px; }

    .profile-header {
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid #222;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #ff007f;
      object-fit: cover;
    }

    .profile-username {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .stats-container {
      display: flex;
      gap: 30px;
      margin-bottom: 18px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-value { font-weight: bold; font-size: 16px; }
    .stat-label { font-size: 12px; color: #888; }

    .action-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 300px;
    }

    .btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .btn-primary { background: #ff007f; color: white; }
    .btn-secondary { background: #222; color: white; border: 1px solid #333; }
    .btn-outline { background: transparent; color: white; border: 1px solid #ff007f; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-top: 2px;
    }

    .grid-item {
      position: relative;
      aspect-ratio: 9/16;
      background: #111;
      cursor: pointer;
      overflow: hidden;
    }

    .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logout-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #ff4757;
      font-size: 13px;
      cursor: pointer;
    }

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="profile-header">
    <button class="logout-btn" id="logoutBtn" onclick="logout()" style="display: none;">Çıkış Yap</button>
    
    <div class="avatar-wrapper">
      <img id="profileAvatar" src="https://ui-avatars.com/api/?background=ff007f&color=fff&name=User" class="profile-avatar">
    </div>

    <h2 id="profileUsername" class="profile-username">Yükleniyor...</h2>

    <div class="stats-container">
      <div class="stat-item">
        <span id="videoCount" class="stat-value">0</span>
        <span class="stat-label">Video</span>
      </div>
      <div class="stat-item">
        <span id="followersCount" class="stat-value">0</span>
        <span class="stat-label">Takipçi</span>
      </div>
      <div class="stat-item">
        <span id="followingCount" class="stat-value">0</span>
        <span class="stat-label">Takip Edilen</span>
      </div>
    </div>

    <div class="action-buttons" id="actionButtons"></div>
  </div>

  <div class="video-grid" id="videoGrid"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script src="notification-listener.js"></script>
  <script>
    let currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) window.location.href = "auth.html";

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid') || currentUser.uid;
    const isOwnProfile = targetUid === currentUser.uid;

    let isFollowing = false;

    async function loadProfile() {
      // 1. Kullanıcı bilgilerini çek
      const userDoc = await db.collection("users").doc(targetUid).get();
      
      // ÇÖZÜM 1: userDoc.exists parantezsiz (boolean property) olarak kontrol ediliyor!
      if (!userDoc.exists) {
        alert("Kullanıcı bulunamadı!");
        window.location.href = "index.html";
        return;
      }

      const userData = userDoc.data();
      const defaultAvatar = `https://ui-avatars.com/api/?background=ff007f&color=fff&name=${encodeURIComponent(userData.username || 'User')}`;
      
      document.getElementById('profileUsername').innerText = `@${userData.username || 'kullanici'}`;
      
      // ÇÖZÜM 2: Eski via.placeholder linki veritabanında varsa bile engelleyip ui-avatars'a düşürüyoruz
      const avatarUrl = (userData.avatar && !userData.avatar.includes('via.placeholder.com')) ? userData.avatar : defaultAvatar;
      document.getElementById('profileAvatar').src = avatarUrl;

      // 2. Takipçi ve Takip Edilen sayılarını çek
      const followersSnap = await db.collection("users").doc(targetUid).collection("followers").get();
      const followingSnap = await db.collection("users").doc(targetUid).collection("following").get();

      document.getElementById('followersCount').innerText = followersSnap.size;
      document.getElementById('followingCount').innerText = followingSnap.size;

      // 3. Butonları Ayarla
      const actionArea = document.getElementById('actionButtons');
      actionArea.innerHTML = "";

      if (isOwnProfile) {
        document.getElementById('logoutBtn').style.display = 'block';
        actionArea.innerHTML = `<button class="btn btn-secondary" onclick="alert('Profil düzenleme yakında!')">Profili Düzenle</button>`;
      } else {
        const followDoc = await db.collection("users").doc(currentUser.uid).collection("following").doc(targetUid).get();
        // ÇÖZÜM 1: followDoc.exists yine parantezsiz kontrol edildi
        isFollowing = followDoc.exists;

        actionArea.innerHTML = `
          <button class="btn ${isFollowing ? 'btn-secondary' : 'btn-primary'}" id="followBtn" onclick="toggleFollow()">
            ${isFollowing ? 'Takiptesin' : 'Takip Et'}
          </button>
          <button class="btn btn-outline" onclick="openDM()">
            💬 Mesaj
          </button>
        `;
      }

      // 4. Kullanıcının videolarını çek
      loadUserVideos();
    }

    async function loadUserVideos() {
      const grid = document.getElementById('videoGrid');
      const snapshot = await db.collection("reels")
        .where("authorUid", "==", targetUid)
        .orderBy("createdAt", "desc")
        .get();

      document.getElementById('videoCount').innerText = snapshot.size;
      grid.innerHTML = "";

      if (snapshot.empty) {
        grid.innerHTML = `<div style="grid-column: span 3; text-align: center; color: #666; padding: 40px 0;">Henüz video yüklenmedi.</div>`;
        return;
      }

      snapshot.forEach(doc => {
        const reel = doc.data();
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.onclick = () => window.location.href = `index.html?video=${doc.id}`;
        item.innerHTML = `
          <video src="${reel.videoUrl}#t=0.1" preload="metadata" muted></video>
        `;
        grid.appendChild(item);
      });
    }

    async function toggleFollow() {
      const followBtn = document.getElementById('followBtn');
      
      if (isFollowing) {
        await db.collection("users").doc(currentUser.uid).collection("following").doc(targetUid).delete();
        await db.collection("users").doc(targetUid).collection("followers").doc(currentUser.uid).delete();
        
        isFollowing = false;
        followBtn.innerText = "Takip Et";
        followBtn.className = "btn btn-primary";
      } else {
        await db.collection("users").doc(currentUser.uid).collection("following").doc(targetUid).set({
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        await db.collection("users").doc(targetUid).collection("followers").doc(currentUser.uid).set({
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        isFollowing = true;
        followBtn.innerText = "Takiptesin";
        followBtn.className = "btn btn-secondary";
      }

      const followersSnap = await db.collection("users").doc(targetUid).collection("followers").get();
      document.getElementById('followersCount').innerText = followersSnap.size;
    }

    function openDM() {
      window.location.href = `chat.html?uid=${targetUid}`;
    }

    function logout() {
      localStorage.removeItem('sliderr_user');
      window.location.href = "auth.html";
    }

    loadProfile();
  </script>
</body>
</html>

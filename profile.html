<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Profil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 70px; }

    .profile-header { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; border-bottom: 1px solid #222; }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #ff007f; margin-bottom: 12px; }
    .profile-username { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .profile-email { font-size: 13px; color: #777; margin-bottom: 16px; }

    .logout-btn { background: #222; color: #ff4757; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }

    .grid-title { padding: 15px 20px 10px; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .grid-item { position: relative; width: 100%; aspect-ratio: 9/16; background: #111; overflow: hidden; }
    .grid-item video { width: 100%; height: 100%; object-fit: cover; }

    /* Alt Navigasyon Barı */
    .navbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: rgba(0, 0, 0, 0.95); border-top: 1px solid #222; display: flex; justify-space: around; align-items: center; z-index: 100; }
    .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="profile-header">
    <img id="userAvatar" class="profile-avatar" src="">
    <div id="userUsername" class="profile-username">@yükleniyor</div>
    <div id="userEmail" class="profile-email"></div>
    <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
  </div>

  <div class="grid-title">Yüklenen Videolar</div>
  <div class="video-grid" id="userVideosGrid"></div>

  <!-- Alt Navigasyon Barı -->
  <nav class="navbar">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('sliderr_user'));

    if (!currentUser) {
      window.location.href = "auth.html";
    } else {
      document.getElementById('userAvatar').src = currentUser.avatar;
      document.getElementById('userUsername').innerText = currentUser.username;
      document.getElementById('userEmail').innerText = currentUser.email || '';
      loadUserVideos();
    }

    async function loadUserVideos() {
      const grid = document.getElementById('userVideosGrid');
      const snapshot = await db.collection("reels").where("authorUid", "==", currentUser.uid).get();

      grid.innerHTML = "";
      if (snapshot.empty) {
        grid.innerHTML = "<div style='grid-column: 1/-1; padding: 40px; text-align: center; color: #555;'>Henüz yüklenmiş bir videon yok.</div>";
        return;
      }

      snapshot.forEach(doc => {
        const reel = doc.data();
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.innerHTML = `<video src="${reel.videoUrl}" muted preload="metadata"></video>`;
        grid.appendChild(item);
      });
    }

    function logout() {
      auth.signOut().then(() => {
        localStorage.removeItem('sliderr_user');
        window.location.href = "auth.html";
      });
    }
  </script>
</body>
</html>

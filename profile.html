<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Profil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 70px; }

    .profile-header { display: flex; flex-direction: column; align-items: center; padding: 30px 20px 20px; border-bottom: 1px solid #222; text-align: center; }
    .profile-avatar { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #ff007f; margin-bottom: 12px; object-fit: cover; }
    .profile-username { font-size: 20px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
    .profile-email { font-size: 13px; color: #777; margin-bottom: 16px; }

    .action-btn-group { display: flex; gap: 10px; }
    .logout-btn, .follow-btn { background: #161616; color: #fff; border: 1px solid #333; padding: 8px 24px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .logout-btn { color: #ff4757; }
    .follow-btn.following { background: #333; color: #aaa; }
    .follow-btn.primary { background: #ff007f; border-color: #ff007f; color: #fff; }

    .stats-row { display: flex; gap: 30px; margin-bottom: 16px; }
    .stat-item { text-align: center; }
    .stat-value { font-size: 16px; font-weight: bold; }
    .stat-label { font-size: 11px; color: #777; }

    .grid-title { padding: 15px 20px 10px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .grid-item { position: relative; width: 100%; aspect-ratio: 9/16; background: #111; overflow: hidden; cursor: pointer; }
    .grid-item video { width: 100%; height: 100%; object-fit: cover; }

    .navbar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 60px; 
      background: rgba(0, 0, 0, 0.95); 
      border-top: 1px solid #222; 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      z-index: 100; 
    }
    .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="profile-header">
    <img id="userAvatar" class="profile-avatar" src="">
    <div id="userUsername" class="profile-username">@yükleniyor</div>
    <div id="userEmail" class="profile-email"></div>

    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-value" id="videoCount">0</div>
        <div class="stat-label">Video</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="followersCount">0</div>
        <div class="stat-label">Takipçi</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="followingCount">0</div>
        <div class="stat-label">Takip Edilen</div>
      </div>
    </div>

    <div class="action-btn-group" id="actionBtnArea"></div>
  </div>

  <div class="grid-title">Videolar</div>
  <div class="video-grid" id="userVideosGrid"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) window.location.href = "auth.html";

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid') || currentUser.uid;
    const isOwnProfile = (targetUid === currentUser.uid);

    let isFollowing = false;

    async function initProfile() {
      if (isOwnProfile) {
        document.getElementById('userAvatar').src = currentUser.avatar;
        document.getElementById('userUsername').innerText = currentUser.username;
        document.getElementById('userEmail').innerText = currentUser.email || '';
        document.getElementById('actionBtnArea').innerHTML = `<button class="logout-btn" onclick="logout()">Çıkış Yap</button>`;
      } else {
        const userDoc = await db.collection("users").doc(targetUid).get();
        if (userDoc.exists) {
          const u = userDoc.data();
          document.getElementById('userAvatar').src = u.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + u.username;
          document.getElementById('userUsername').innerText = u.username;
          document.getElementById('userEmail').innerText = '';
        }
        await checkFollowStatus();
      }

      loadFollowStats();
      loadUserVideos();
    }

    async function checkFollowStatus() {
      const followDoc = await db.collection("users").doc(currentUser.uid).collection("following").doc(targetUid).get();
      isFollowing = followDoc.exists;
      renderFollowButton();
    }

    function renderFollowButton() {
      const area = document.getElementById('actionBtnArea');
      if (isFollowing) {
        area.innerHTML = `<button class="follow-btn following" onclick="toggleFollow()">Takip Ediliyor</button>`;
      } else {
        area.innerHTML = `<button class="follow-btn primary" onclick="toggleFollow()">Takip Et</button>`;
      }
    }

    async function toggleFollow() {
      const myFollowingRef = db.collection("users").doc(currentUser.uid).collection("following").doc(targetUid);
      const targetFollowersRef = db.collection("users").doc(targetUid).collection("followers").doc(currentUser.uid);

      if (isFollowing) {
        await myFollowingRef.delete();
        await targetFollowersRef.delete();
        isFollowing = false;
      } else {
        await myFollowingRef.set({ timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        await targetFollowersRef.set({ timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        isFollowing = true;
      }
      renderFollowButton();
      loadFollowStats();
    }

    async function loadFollowStats() {
      const followersSnap = await db.collection("users").doc(targetUid).collection("followers").get();
      const followingSnap = await db.collection("users").doc(targetUid).collection("following").get();

      document.getElementById('followersCount').innerText = followersSnap.size;
      document.getElementById('followingCount').innerText = followingSnap.size;
    }

    async function loadUserVideos() {
      const grid = document.getElementById('userVideosGrid');
      const snapshot = await db.collection("reels").where("authorUid", "==", targetUid).get();

      grid.innerHTML = "";
      document.getElementById('videoCount').innerText = snapshot.size;

      if (snapshot.empty) {
        grid.innerHTML = "<div style='grid-column: 1/-1; padding: 40px; text-align: center; color: #555;'>Henüz yüklenmiş video yok.</div>";
        return;
      }

      snapshot.forEach(doc => {
        const reel = doc.data();
        const reelId = doc.id;
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.onclick = () => window.location.href = `index.html?video=${reelId}`;
        item.innerHTML = `<video src="${reel.videoUrl}" muted preload="metadata"></video>`;
        grid.appendChild(item);
      });
    }

    function logout() {
      auth.signOut().then(() => {
        localStorage.removeItem('sliderr_user');
        window.location.href = "auth.html";
      });
    }

    initProfile();
  </script>
</body>
</html>

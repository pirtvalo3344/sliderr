<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Keşfet & Arama</title>
  <link rel="stylesheet" href="toast.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 70px; }

    .search-header {
      padding: 15px;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 10;
      border-bottom: 1px solid #222;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      width: 100%;
      background: #121212;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 12px 16px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    .search-box:focus { border-color: #ff007f; }

    .tabs { display: flex; border-bottom: 1px solid #222; }
    .tab-btn {
      flex: 1; padding: 10px 0; background: none; border: none;
      color: #888; font-weight: bold; font-size: 14px; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: #ff007f; border-bottom-color: #ff007f; }

    .results-container { padding: 15px; }

    .user-list { display: flex; flex-direction: column; gap: 10px; }
    .user-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: #111; border-radius: 12px; cursor: pointer;
    }
    .user-card:hover { background: #1a1a1a; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 45px; height: 45px; border-radius: 50%; border: 1.5px solid #ff007f; object-fit: cover; }
    .username-text { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 5px; }
    .private-badge { font-size: 12px; color: #aaa; }

    .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .video-card {
      position: relative; aspect-ratio: 9/16; background: #111;
      border-radius: 6px; overflow: hidden; cursor: pointer;
    }
    .video-card video { width: 100%; height: 100%; object-fit: cover; }
    .video-caption-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      padding: 6px; font-size: 11px; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 999;
    }

    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      height: 100%;
    }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }

    .empty-msg { text-align: center; color: #666; margin-top: 40px; font-size: 14px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="search-header">
    <input type="text" id="searchInput" class="search-box" placeholder="Hesap veya video açıklaması ara..." oninput="onSearchInput()">
    
    <div class="tabs">
      <button class="tab-btn active" id="tabUsers" onclick="switchTab('users')">👤 Hesaplar</button>
      <button class="tab-btn" id="tabVideos" onclick="switchTab('videos')">🎬 Videolar</button>
    </div>
  </div>

  <div class="results-container">
    <div id="usersResult" class="user-list"></div>
    <div id="videosResult" class="video-grid" style="display: none;"></div>
    <div id="emptyMsg" class="empty-msg">Aramak istediğiniz terimi yazın.</div>
  </div>

  <nav class="navbar">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item active"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script src="notification-listener.js"></script>
  <script>
    let currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) window.location.href = "auth.html";

    let activeTab = 'users';
    let searchTimeout = null;

    function cleanText(str) {
      if (!str) return '';
      return str.toString()
        .replace(/^@+/, '')
        .replace(/I/g, 'ı').replace(/İ/g, 'i')
        .toLowerCase()
        .trim();
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabUsers').classList.toggle('active', tab === 'users');
      document.getElementById('tabVideos').classList.toggle('active', tab === 'videos');

      document.getElementById('usersResult').style.display = tab === 'users' ? 'flex' : 'none';
      document.getElementById('videosResult').style.display = tab === 'videos' ? 'grid' : 'none';

      executeSearch();
    }

    function onSearchInput() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(executeSearch, 250);
    }

    async function executeSearch() {
      const rawQuery = document.getElementById('searchInput').value;
      const query = cleanText(rawQuery);
      
      const usersContainer = document.getElementById('usersResult');
      const videosContainer = document.getElementById('videosResult');
      const emptyMsg = document.getElementById('emptyMsg');

      usersContainer.innerHTML = "";
      videosContainer.innerHTML = "";

      if (!query) {
        emptyMsg.style.display = 'block';
        emptyMsg.innerText = "Aramak istediğiniz terimi yazın.";
        return;
      }

      emptyMsg.style.display = 'block';
      emptyMsg.innerText = "Aranıyor...";

      if (activeTab === 'users') {
        await searchUsers(query);
      } else {
        await searchVideos(query);
      }
    }

    async function searchUsers(query) {
      const container = document.getElementById('usersResult');
      const emptyMsg = document.getElementById('emptyMsg');

      const snapshot = await db.collection("users").get();
      const uniqueUids = new Set();
      let matchCount = 0;

      snapshot.docs.forEach(doc => {
        const uid = doc.id;
        const user = doc.data();

        if (uid === currentUser.uid || uniqueUids.has(uid)) return;

        const formattedUsername = cleanText(user.username);

        if (formattedUsername.includes(query)) {
          uniqueUids.add(uid);
          matchCount++;

          const avatarUrl = (user.avatar && !user.avatar.includes('via.placeholder.com')) 
            ? user.avatar 
            : `https://ui-avatars.com/api/?background=ff007f&color=fff&name=${encodeURIComponent(formattedUsername)}`;
          
          const isPrivate = user.isPrivate === true;

          const card = document.createElement('div');
          card.className = 'user-card';
          card.onclick = () => window.location.href = `profile.html?uid=${uid}`;
          card.innerHTML = `
            <div class="user-info">
              <img src="${avatarUrl}" class="user-avatar">
              <div>
                <div class="username-text">
                  @${formattedUsername}
                  ${isPrivate ? '<span title="Gizli">🔒</span>' : ''}
                </div>
                <div class="private-badge">${isPrivate ? 'Gizli Hesap' : 'Herkese Açık'}</div>
              </div>
            </div>
            <span style="color: #666;">➔</span>
          `;
          container.appendChild(card);
        }
      });

      if (matchCount === 0) {
        emptyMsg.style.display = 'block';
        emptyMsg.innerText = "Kullanıcı bulunamadı.";
      } else {
        emptyMsg.style.display = 'none';
      }
    }

    async function searchVideos(query) {
      const container = document.getElementById('videosResult');
      const emptyMsg = document.getElementById('emptyMsg');

      const snapshot = await db.collection("reels").get();
      const uniqueReelIds = new Set();
      let matchCount = 0;

      for (const doc of snapshot.docs) {
        const reelId = doc.id;
        const reel = doc.data();
        const caption = cleanText(reel.caption);

        if (uniqueReelIds.has(reelId)) continue;

        if (caption.includes(query)) {
          if (reel.authorUid !== currentUser.uid) {
            const authorDoc = await db.collection("users").doc(reel.authorUid).get();
            if (authorDoc.exists && authorDoc.data().isPrivate) {
              const myFollow = await db.collection("users").doc(currentUser.uid).collection("following").doc(reel.authorUid).get();
              const targetFollow = await db.collection("users").doc(reel.authorUid).collection("following").doc(currentUser.uid).get();
              if (!myFollow.exists || !targetFollow.exists) continue;
            }
          }

          uniqueReelIds.add(reelId);
          matchCount++;

          const videoCard = document.createElement('div');
          videoCard.className = 'video-card';
          videoCard.onclick = () => window.location.href = `index.html?video=${reelId}`;
          videoCard.innerHTML = `
            <video src="${reel.videoUrl}#t=0.1" preload="metadata" muted></video>
            <div class="video-caption-overlay">${reel.caption || ''}</div>
          `;
          container.appendChild(videoCard);
        }
      }

      if (matchCount === 0) {
        emptyMsg.style.display = 'block';
        emptyMsg.innerText = "Eşleşen video bulunamadı.";
      } else {
        emptyMsg.style.display = 'none';
      }
    }
  </script>
</body>
</html>

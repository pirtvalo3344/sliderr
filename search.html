<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Keşfet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 70px; }

    .search-header { position: sticky; top: 0; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 1px solid #222; z-index: 10; }
    .search-input-wrapper { display: flex; align-items: center; background: #111; border: 1px solid #333; border-radius: 12px; padding: 0 12px; }
    .search-input-wrapper:focus-within { border-color: #ff007f; }
    .search-icon { font-size: 16px; margin-right: 8px; color: #888; }
    .search-input { width: 100%; background: none; border: none; color: white; padding: 12px 0; font-size: 14px; outline: none; }

    .grid-title { padding: 15px 20px 10px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .grid-item { position: relative; width: 100%; aspect-ratio: 9/16; background: #111; overflow: hidden; cursor: pointer; }
    .grid-item video { width: 100%; height: 100%; object-fit: cover; }

    .navbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: rgba(0, 0, 0, 0.95); border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="search-header">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Açıklama veya kullanıcı ara..." oninput="handleSearch()">
    </div>
  </div>

  <div class="grid-title" id="gridTitle">Tüm Videolar</div>
  <div class="video-grid" id="searchGrid"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item active"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) window.location.href = "auth.html";

    let allReels = [];

    async function loadAllReels() {
      const snapshot = await db.collection("reels").orderBy("createdAt", "desc").get();
      allReels = [];
      snapshot.forEach(doc => allReels.push({ id: doc.id, ...doc.data() }));
      renderGrid(allReels);
    }

    function renderGrid(reels) {
      const grid = document.getElementById('searchGrid');
      grid.innerHTML = "";

      if (reels.length === 0) {
        grid.innerHTML = "<div style='grid-column: 1/-1; padding: 40px; text-align: center; color: #555;'>Sonuç bulunamadı.</div>";
        return;
      }

      reels.forEach(reel => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        // Tıklanınca o videonun ID'si ile akışa yönlendir
        item.onclick = () => window.location.href = `index.html?video=${reel.id}`;
        item.innerHTML = `<video src="${reel.videoUrl}" muted preload="metadata"></video>`;
        grid.appendChild(item);
      });
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const title = document.getElementById('gridTitle');

      if (!query) {
        title.innerText = "Tüm Videolar";
        renderGrid(allReels);
        return;
      }

      title.innerText = "Arama Sonuçları";
      const filtered = allReels.filter(reel => 
        (reel.caption && reel.caption.toLowerCase().includes(query)) ||
        (reel.authorName && reel.authorName.toLowerCase().includes(query))
      );
      renderGrid(filtered);
    }

    loadAllReels();
  </script>
</body>
</html>

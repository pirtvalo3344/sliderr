<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Keþfet & Arama</title>
  <link rel="stylesheet" href="toast.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding-bottom: 70px; }

    .search-header {
      padding: 15px;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 10;
      border-bottom: 1px solid #222;
    }

    .search-box {
      width: 100%;
      background: #121212;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 10px 15px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    .search-box:focus { border-color: #ff007f; }

    .results-list {
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: #111;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-card:hover { background: #1a1a1a; }

    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 45px; height: 45px; border-radius: 50%; border: 1.5px solid #ff007f; object-fit: cover; }
    .user-name-container { display: flex; flex-direction: column; }
    .username-text { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 5px; }
    .private-badge { font-size: 12px; color: #aaa; }

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="search-header">
    <input type="text" id="searchInput" class="search-box" placeholder="Kullanýcý adý ara..." oninput="searchUsers()">
  </div>

  <div class="results-list" id="resultsList">
    <div style="text-align: center; color: #666; margin-top: 30px;">Aramak istediðiniz kullanýcý adýný yazýn.</div>
  </div>

  <nav class="navbar">
    <a href="index.html" class="nav-item"><span class="nav-icon">??</span><span>Akýþ</span></a>
    <a href="search.html" class="nav-item active"><span class="nav-icon">??</span><span>Keþfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">?</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">??</span><span>Profil</span></a>
  </nav>

  <script src="notification-listener.js"></script>
  <script>
    let currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) window.location.href = "auth.html";

    async function searchUsers() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultsList = document.getElementById('resultsList');

      if (!query) {
        resultsList.innerHTML = `<div style="text-align: center; color: #666; margin-top: 30px;">Aramak istediðiniz kullanýcý adýný yazýn.</div>`;
        return;
      }

      // Firestore'da kullanýcý adý arama
      const snapshot = await db.collection("users")
        .where("username", ">=", query)
        .where("username", "<=", query + '\uf8ff')
        .limit(10)
        .get();

      resultsList.innerHTML = "";

      if (snapshot.empty) {
        resultsList.innerHTML = `<div style="text-align: center; color: #666; margin-top: 30px;">Kullanýcý bulunamadý.</div>`;
        return;
      }

      snapshot.forEach(doc => {
        const user = doc.data();
        const uid = doc.id;
        if (uid === currentUser.uid) return; // Kendimizi listede gösterme

        const defaultAvatar = `https://ui-avatars.com/api/?background=ff007f&color=fff&name=${encodeURIComponent(user.username || 'U')}`;
        const avatarUrl = (user.avatar && !user.avatar.includes('via.placeholder.com')) ? user.avatar : defaultAvatar;
        const isPrivate = user.isPrivate === true;

        const card = document.createElement('div');
        card.className = 'user-card';
        card.onclick = () => window.location.href = `profile.html?uid=${uid}`;
        card.innerHTML = `
          <div class="user-info">
            <img src="${avatarUrl}" class="user-avatar">
            <div class="user-name-container">
              <span class="username-text">
                @${user.username}
                ${isPrivate ? '<span title="Gizli Hesap">??</span>' : ''}
              </span>
              <span class="private-badge">${isPrivate ? 'Gizli Hesap' : 'Herkese Açýk'}</span>
            </div>
          </div>
          <span style="color: #666;">?</span>
        `;
        resultsList.appendChild(card);
      });
    }
  </script>
</body>
</html>

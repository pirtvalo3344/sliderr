<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Görüntülü Görüşme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }

    .call-header {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #222;
      background: #111;
      font-size: 16px;
      font-weight: bold;
      color: #ff007f;
    }

    .video-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      padding: 15px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    @media (min-width: 600px) {
      .video-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .video-card {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      background: #121212;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #222;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .video-card div[id] {
      width: 100%;
      height: 100%;
    }

    .video-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #111;
      border-top: 1px solid #222;
    }

    .control-btn {
      background: #e50914;
      border: 1px solid #e50914;
      color: #fff;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn:active { transform: scale(0.95); }

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 999;
    }

    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      height: 100%;
    }

    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <!-- Agora Web SDK CDN -->
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
</head>
<body>

  <div class="call-header" id="call-title">
    🎥 Görüntülü Görüşme
  </div>

  <div class="video-grid">
    <div class="video-card">
      <div class="video-label">Sen</div>
      <div id="local-player"></div>
    </div>
    <div class="video-card">
      <div class="video-label">Karşı Taraf</div>
      <div id="remote-player"></div>
    </div>
  </div>

  <div class="controls-bar">
    <button id="leave-btn" class="control-btn">❌ Aramayı Kapat</button>
  </div>

  <nav class="navbar">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script src="./main.js"></script>
</body>
</html>

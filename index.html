<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Akış</title>
  <link rel="stylesheet" href="toast.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100vh; }

    .reels-container {
      height: calc(100vh - 60px);
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      scrollbar-width: none;
    }
    .reels-container::-webkit-scrollbar { display: none; }

    .reel {
      height: calc(100vh - 60px);
      width: 100vw;
      scroll-snap-align: start;
      position: relative;
      background: #000;
    }

    .reel video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .reel-overlay {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 70px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #ff007f;
      object-fit: cover;
    }

    .author-username {
      font-weight: bold;
      font-size: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reel-caption {
      font-size: 14px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .side-actions {
      position: absolute;
      right: 15px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 5;
    }

    .action-btn {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 24px;
      cursor: pointer;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .action-btn.liked { color: #ff007f; }
    .action-count { font-size: 12px; font-weight: bold; }

    .empty-state {
      height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #888;
      padding: 20px;
    }

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="reels-container" id="reelsContainer">
    <div class="empty-state">Yükleniyor...</div>
  </div>

  <nav class="navbar">
    <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script src="notification-listener.js"></script>
  <script>
    let currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) window.location.href = "auth.html";

    async function loadReels() {
      const container = document.getElementById('reelsContainer');
      const snapshot = await db.collection("reels").orderBy("createdAt", "desc").get();

      if (snapshot.empty) {
        container.innerHTML = `<div class="empty-state">Henüz hiç Sliderable yüklenmemiş.</div>`;
        return;
      }

      container.innerHTML = "";
      let loadedCount = 0;

      for (const doc of snapshot.docs) {
        const reel = doc.data();
        const reelId = doc.id;
        const authorUid = reel.authorUid;

        // GIZLILIK KONTROLU: Kendimiz değilsek kontrol et
        if (authorUid !== currentUser.uid) {
          const authorDoc = await db.collection("users").doc(authorUid).get();
          
          if (authorDoc.exists) {
            const authorData = authorDoc.data();

            // Eğer videoyu paylaşan kişinin hesabı GİZLİ ise:
            if (authorData.isPrivate) {
              const myFollow = await db.collection("users").doc(currentUser.uid).collection("following").doc(authorUid).get();
              const targetFollow = await db.collection("users").doc(authorUid).collection("following").doc(currentUser.uid).get();

              // Karşılıklı takip yoksa gizli hesaba ait bu videoyu akışa koyma!
              const isMutual = myFollow.exists && targetFollow.exists;
              if (!isMutual) continue;
            }
          }
        }

        // Eğer gizli değilse veya karşılıklı takip varsa akışa ekle
        await createReelCard(reelId, reel);
        loadedCount++;
      }

      if (loadedCount === 0) {
        container.innerHTML = `<div class="empty-state">Akışınızda gösterilecek Sliderable bulunamadı.<br>Gizli hesap içeriklerini görmek için karşılıklı takipleşmelisiniz.</div>`;
      } else {
        setupIntersectionObserver();
      }
    }

    async function createReelCard(reelId, reel) {
      const container = document.getElementById('reelsContainer');

      // Yazar Bilgilerini Al
      const authorDoc = await db.collection("users").doc(reel.authorUid).get();
      const authorData = authorDoc.exists ? authorDoc.data() : { username: 'kullanici' };

      const defaultAvatar = `https://ui-avatars.com/api/?background=ff007f&color=fff&name=${encodeURIComponent(authorData.username || 'U')}`;
      const avatarUrl = (authorData.avatar && !authorData.avatar.includes('via.placeholder.com')) ? authorData.avatar : defaultAvatar;

      // Beğeni Sayısı ve Durumu
      const likesSnap = await db.collection("reels").doc(reelId).collection("likes").get();
      const likesCount = likesSnap.size;

      const myLikeSnap = await db.collection("reels").doc(reelId).collection("likes").doc(currentUser.uid).get();
      const isLiked = myLikeSnap.exists;

      const reelEl = document.createElement('div');
      reelEl.className = 'reel';
      reelEl.innerHTML = `
        <video src="${reel.videoUrl}" loop playsinline preload="metadata" onclick="togglePlay(this)"></video>

        <div class="reel-overlay">
          <div class="author-info" onclick="window.location.href='profile.html?uid=${reel.authorUid}'">
            <img src="${avatarUrl}" class="author-avatar">
            <span class="author-username">@${authorData.username || 'kullanici'} ${authorData.isPrivate ? '🔒' : ''}</span>
          </div>
          <div class="reel-caption">${reel.caption || ''}</div>
        </div>

        <div class="side-actions">
          <button class="action-btn ${isLiked ? 'liked' : ''}" id="likeBtn_${reelId}" onclick="toggleLike('${reelId}')">
            ❤️
            <span class="action-count" id="likeCount_${reelId}">${likesCount}</span>
          </button>
          <button class="action-btn" onclick="window.location.href='chat.html?uid=${reel.authorUid}'">
            💬
          </button>
        </div>
      `;

      container.appendChild(reelEl);
    }

    async function toggleLike(reelId) {
      const likeBtn = document.getElementById(`likeBtn_${reelId}`);
      const likeCountEl = document.getElementById(`likeCount_${reelId}`);
      const likeRef = db.collection("reels").doc(reelId).collection("likes").doc(currentUser.uid);

      let currentLikes = parseInt(likeCountEl.innerText) || 0;

      if (likeBtn.classList.contains('liked')) {
        // Beğeniyi Kaldır
        likeBtn.classList.remove('liked');
        likeCountEl.innerText = Math.max(0, currentLikes - 1);
        await likeRef.delete();
      } else {
        // Beğen
        likeBtn.classList.add('liked');
        likeCountEl.innerText = currentLikes + 1;
        await likeRef.set({ timestamp: firebase.firestore.FieldValue.serverTimestamp() });
      }
    }

    function togglePlay(video) {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function setupIntersectionObserver() {
      const options = { threshold: 0.6 };
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (video) {
            if (entry.isIntersecting) {
              video.play().catch(e => console.log("Otomatik oynatma engellendi:", e));
            } else {
              video.pause();
              video.currentTime = 0;
            }
          }
        });
      }, options);

      document.querySelectorAll('.reel').forEach(reel => observer.observe(reel));
    }

    loadReels();
  </script>
</body>
</html>

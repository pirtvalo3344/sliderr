<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Akış</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }

    .reels-container {
      width: 100vw;
      height: calc(100vh - 60px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .reels-container::-webkit-scrollbar { display: none; }

    .reel {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    .sound-toggle-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 18px;
    }

    .reel-overlay {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 70px;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .author-info { 
      display: inline-flex; 
      align-items: center; 
      gap: 10px; 
      margin-bottom: 8px; 
      cursor: pointer;
    }
    .author-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #ff007f; object-fit: cover; }
    .author-name { font-weight: bold; font-size: 15px; }
    .video-caption { font-size: 14px; color: #ddd; line-height: 1.3; }

    .actions-sidebar {
      position: absolute;
      right: 15px;
      bottom: 30px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }
    .action-btn {
      background: none;
      border: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 24px;
    }
    .action-btn span { font-size: 12px; font-weight: 600; }
    .liked { color: #ff007f; }

    /* Yorum Penceresi (Modal) */
    .comments-modal {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 60vh;
      background: #121212;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      z-index: 200;
      transition: bottom 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
    }
    .comments-modal.active { bottom: 0; }

    .comments-header {
      padding: 15px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .close-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }

    .comments-list {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .comment-item { display: flex; gap: 10px; align-items: flex-start; }
    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; }
    .comment-content { background: #1a1a1a; padding: 10px 12px; border-radius: 12px; max-width: 85%; }
    .comment-author { font-size: 12px; font-weight: bold; color: #ff007f; margin-bottom: 2px; cursor: pointer; }
    .comment-text { font-size: 13px; color: #eee; word-break: break-word; }

    .comments-input-area {
      padding: 12px 15px;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
      background: #000;
    }
    .comment-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 10px 15px;
      color: white;
      outline: none;
      font-size: 13px;
    }
    .comment-input:focus { border-color: #ff007f; }
    .send-btn { background: #ff007f; color: white; border: none; padding: 0 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="toast.css">
</head>
<body>

  <button class="sound-toggle-btn" id="soundToggleBtn" onclick="toggleGlobalSound()">🔇</button>
  <div class="reels-container" id="reelsContainer"></div>

  <!-- Yorum Yapma Modalı -->
  <div class="comments-modal" id="commentsModal">
    <div class="comments-header">
      <span>Yorumlar</span>
      <button class="close-btn" onclick="closeComments()">✕</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comments-input-area">
      <input type="text" id="commentInput" class="comment-input" placeholder="Yorum yaz...">
      <button class="send-btn" onclick="postComment()">Gönder</button>
    </div>
  </div>

  <nav class="navbar">
    <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    let isGlobalMuted = true;
    let activeReelId = null;

    if (!currentUser) window.location.href = "auth.html";

    const urlParams = new URLSearchParams(window.location.search);
    const targetVideoId = urlParams.get('video');

    // Dizi elemanlarını rastgele karıştırmak için yardımcı fonksiyon (Fisher-Yates)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    async function loadReels() {
      const container = document.getElementById('reelsContainer');

      // 1. Kullanıcının takip ettiği kişilerin listesini al
      const followingSnap = await db.collection("users").doc(currentUser.uid).collection("following").get();
      const followingUids = followingSnap.docs.map(doc => doc.id);

      // 2. Tüm videoları çek
      const snapshot = await db.collection("reels").orderBy("createdAt", "desc").get();

      if (snapshot.empty) {
        container.innerHTML = "<div style='display:flex; justify-content:center; align-items:center; height:100%; color:#666;'>Henüz video yok.</div>";
        return;
      }

      let followingReels = [];
      let exploreReels = [];

      snapshot.forEach(doc => {
        const reel = { id: doc.id, ...doc.data() };
        if (followingUids.includes(reel.authorUid)) {
          followingReels.push(reel);
        } else {
          exploreReels.push(reel);
        }
      });

      // Keşfet videolarını rastgele harmanla
      exploreReels = shuffleArray(exploreReels);

      // 3. Hibrit Akış Oluşturma (2 Takip Edilen / 1 Keşfet Dengesi)
      let finalFeed = [];
      let fIndex = 0;
      let eIndex = 0;

      while (fIndex < followingReels.length || eIndex < exploreReels.length) {
        // 2 adet Takip Edilen video ekle
        if (fIndex < followingReels.length) finalFeed.push(followingReels[fIndex++]);
        if (fIndex < followingReels.length) finalFeed.push(followingReels[fIndex++]);

        // 1 adet Keşfet videosu ekle
        if (eIndex < exploreReels.length) finalFeed.push(exploreReels[eIndex++]);
      }

      container.innerHTML = "";
      let targetElement = null;

      finalFeed.forEach(reel => {
        const isLiked = reel.likes && reel.likes.includes(currentUser.uid);
        const commentCount = reel.commentCount || 0;

        const reelEl = document.createElement('div');
        reelEl.className = 'reel';
        reelEl.id = `reel-${reel.id}`;
        reelEl.innerHTML = `
          <video loop muted playsinline onclick="togglePlay(this)">
            <source src="${reel.videoUrl}" type="video/mp4">
          </video>
          
          <div class="reel-overlay">
            <div class="author-info" onclick="window.location.href='profile.html?uid=${reel.authorUid}'">
              <img src="${reel.authorAvatar}" class="author-avatar">
              <span class="author-name">${reel.authorName}</span>
            </div>
            <div class="video-caption">${reel.caption || ''}</div>
          </div>

          <div class="actions-sidebar">
            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${reel.id}', this)">
              ❤️ <span class="like-count">${reel.likes ? reel.likes.length : 0}</span>
            </button>
            <button class="action-btn" onclick="openComments('${reel.id}')">
              💬 <span id="comment-count-${reel.id}">${commentCount}</span>
            </button>
          </div>
        `;
        container.appendChild(reelEl);

        if (targetVideoId && reel.id === targetVideoId) {
          targetElement = reelEl;
        }
      });

      setupScrollAndVideoObserver();

      if (targetElement) {
        setTimeout(() => {
          targetElement.scrollIntoView({ behavior: 'smooth' });
        }, 300);
      }
    }

    function setupScrollAndVideoObserver() {
      const videos = document.querySelectorAll('.reel video');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target;
          if (entry.isIntersecting) {
            video.muted = isGlobalMuted;
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        });
      }, { threshold: 0.6 });

      videos.forEach(video => observer.observe(video));
    }

    function togglePlay(video) {
      if (video.paused) video.play();
      else video.pause();
    }

    function toggleGlobalSound() {
      isGlobalMuted = !isGlobalMuted;
      document.getElementById('soundToggleBtn').innerText = isGlobalMuted ? "🔇" : "🔊";
      document.querySelectorAll('.reel video').forEach(v => v.muted = isGlobalMuted);
    }

    async function toggleLike(reelId, btn) {
      const reelRef = db.collection("reels").doc(reelId);
      const countSpan = btn.querySelector('.like-count');
      let currentLikes = parseInt(countSpan.innerText) || 0;

      if (btn.classList.contains('liked')) {
        btn.classList.remove('liked');
        countSpan.innerText = Math.max(0, currentLikes - 1);
        await reelRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
      } else {
        btn.classList.add('liked');
        countSpan.innerText = currentLikes + 1;
        await reelRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
      }
    }

    /* YORUM SİSTEMİ İŞLEVLERİ */
    async function openComments(reelId) {
      activeReelId = reelId;
      document.getElementById('commentsModal').classList.add('active');
      loadComments(reelId);
    }

    function closeComments() {
      document.getElementById('commentsModal').classList.remove('active');
      activeReelId = null;
    }

    async function loadComments(reelId) {
      const list = document.getElementById('commentsList');
      list.innerHTML = "<div style='text-align:center; color:#666;'>Yorumlar yükleniyor...</div>";

      const snapshot = await db.collection("reels").doc(reelId).collection("comments").orderBy("createdAt", "asc").get();

      list.innerHTML = "";
      if (snapshot.empty) {
        list.innerHTML = "<div style='text-align:center; color:#666;'>İlk yorumu sen yaz!</div>";
        return;
      }

      snapshot.forEach(doc => {
        const c = doc.data();
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <img src="${c.authorAvatar}" class="comment-avatar" onclick="window.location.href='profile.html?uid=${c.authorUid}'">
          <div class="comment-content">
            <div class="comment-author" onclick="window.location.href='profile.html?uid=${c.authorUid}'">${c.authorName}</div>
            <div class="comment-text">${c.text}</div>
          </div>
        `;
        list.appendChild(item);
      });

      list.scrollTop = list.scrollHeight;
    }

    async function postComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();

      if (!text || !activeReelId) return;

      input.value = "";

      await db.collection("reels").doc(activeReelId).collection("comments").add({
        text: text,
        authorUid: currentUser.uid,
        authorName: currentUser.username,
        authorAvatar: currentUser.avatar,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      const reelRef = db.collection("reels").doc(activeReelId);
      await reelRef.update({
        commentCount: firebase.firestore.FieldValue.increment(1)
      });

      const countSpan = document.getElementById(`comment-count-${activeReelId}`);
      if (countSpan) {
        countSpan.innerText = (parseInt(countSpan.innerText) || 0) + 1;
      }

      loadComments(activeReelId);
    }

    loadReels();
  </script>
  <script src="notification-listener.js"></script>
</body>
</html>

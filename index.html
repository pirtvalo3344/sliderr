<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Akış</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }

    /* Ana Akış Konteyneri */
    .reels-container {
      width: 100vw;
      height: calc(100vh - 60px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .reels-container::-webkit-scrollbar { display: none; }

    /* Video Kartı */
    .reel {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Sol Üst Ses Butonu */
    .sound-toggle-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.2s, background 0.2s;
    }
    .sound-toggle-btn:hover {
      transform: scale(1.1);
      background: rgba(0, 0, 0, 0.8);
    }

    /* Video Üstü Bilgiler */
    .reel-overlay {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 70px;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .author-info { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .author-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #ff007f; }
    .author-name { font-weight: bold; font-size: 15px; }
    .video-caption { font-size: 14px; color: #ddd; line-height: 1.3; }

    /* Sağ Eylem Butonları (Beğeni / Yorum) */
    .actions-sidebar {
      position: absolute;
      right: 15px;
      bottom: 30px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }
    .action-btn {
      background: none;
      border: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 24px;
    }
    .action-btn span { font-size: 12px; font-weight: 600; }
    .liked { color: #ff007f; }

    /* Alt Navigasyon Barı */
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.95);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      gap: 3px;
    }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <!-- Sol Üst Ses Aç/Kapat Butonu -->
  <button class="sound-toggle-btn" id="soundToggleBtn" onclick="toggleGlobalSound()">🔇</button>

  <!-- Akış Kutusu -->
  <div class="reels-container" id="reelsContainer"></div>

  <!-- Alt Navigasyon Barı -->
  <nav class="navbar">
    <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    let isGlobalMuted = true; // Varsayılan olarak sessiz (otomatik oynatma için)
    let currentReelIndex = 0;
    let reelsData = [];

    // Giriş kontrolü
    if (!currentUser) {
      window.location.href = "auth.html";
    }

    // Videoları Yükle
    async function loadReels() {
      const container = document.getElementById('reelsContainer');
      const snapshot = await db.collection("reels").orderBy("createdAt", "desc").get();
      
      container.innerHTML = "";
      reelsData = [];

      if (snapshot.empty) {
        container.innerHTML = "<div style='display:flex; justify-content:center; align-items:center; height:100%; color:#666;'>Henüz video yok. İlk videoyu sen yükle!</div>";
        return;
      }

      snapshot.forEach(doc => {
        const reel = { id: doc.id, ...doc.data() };
        reelsData.push(reel);
        const isLiked = reel.likes && reel.likes.includes(currentUser.uid);

        const reelEl = document.createElement('div');
        reelEl.className = 'reel';
        reelEl.innerHTML = `
          <video src="${reel.videoUrl}" loop muted playsinline onclick="togglePlay(this)"></video>
          
          <div class="reel-overlay">
            <div class="author-info">
              <img src="${reel.authorAvatar}" class="author-avatar">
              <span class="author-name">${reel.authorName}</span>
            </div>
            <div class="video-caption">${reel.caption || ''}</div>
          </div>

          <div class="actions-sidebar">
            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${reel.id}', this)">
              ❤️ <span class="like-count">${reel.likes ? reel.likes.length : 0}</span>
            </button>
          </div>
        `;
        container.appendChild(reelEl);
      });

      setupScrollAndVideoObserver();
    }

    // Video Oynatma / Durdurma & Scroll Tespiti
    function setupScrollAndVideoObserver() {
      const videos = document.querySelectorAll('.reel video');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target;
          if (entry.isIntersecting) {
            video.muted = isGlobalMuted;
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        });
      }, { threshold: 0.6 });

      videos.forEach((video, idx) => {
        observer.observe(video);
      });
    }

    // Tıklayınca Durdur / Başlat
    function togglePlay(video) {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    // Global Ses Aç / Kapat
    function toggleGlobalSound() {
      isGlobalMuted = !isGlobalMuted;
      const btn = document.getElementById('soundToggleBtn');
      btn.innerText = isGlobalMuted ? "🔇" : "🔊";

      const videos = document.querySelectorAll('.reel video');
      videos.forEach(video => {
        video.muted = isGlobalMuted;
      });
    }

    // PC / Klavye Kontrolleri (Yukarı/Aşağı Ok ve Space)
    document.addEventListener('keydown', (e) => {
      const container = document.getElementById('reelsContainer');
      const reelHeight = container.clientHeight;

      if (e.key === "ArrowDown") {
        e.preventDefault();
        container.scrollBy({ top: reelHeight, behavior: 'smooth' });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        container.scrollBy({ top: -reelHeight, behavior: 'smooth' });
      } else if (e.key === " ") {
        e.preventDefault();
        // Şu an görünürdeki videoyu bul ve oynat/durdur
        const videos = document.querySelectorAll('.reel video');
        videos.forEach(video => {
          const rect = video.getBoundingClientRect();
          if (rect.top >= 0 && rect.bottom <= window.innerHeight) {
            togglePlay(video);
          }
        });
      } else if (e.key === "m" || e.key === "M") {
        toggleGlobalSound();
      }
    });

    // Beğeni Butonu
    async function toggleLike(reelId, btn) {
      const reelRef = db.collection("reels").doc(reelId);
      const countSpan = btn.querySelector('.like-count');
      let currentLikes = parseInt(countSpan.innerText) || 0;

      if (btn.classList.contains('liked')) {
        btn.classList.remove('liked');
        countSpan.innerText = Math.max(0, currentLikes - 1);
        await reelRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
      } else {
        btn.classList.add('liked');
        countSpan.innerText = currentLikes + 1;
        await reelRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
      }
    }

    loadReels();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sliderr - Yükle</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .upload-box { background: #121212; padding: 24px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; border: 1px solid #222; margin-top: 40px; }
    input, textarea { width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; box-sizing: border-box; font-size: 14px; }
    button { background: linear-gradient(45deg, #ff007f, #7928ca); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; margin-top: 10px; }
    #status { margin-top: 15px; color: #ff007f; word-break: break-all; font-size: 14px; }

    .bottom-nav {
      position: fixed; bottom: 0; width: 100%; max-width: 420px; height: 60px;
      background: rgba(0, 0, 0, 0.9); border-top: 1px solid #222;
      display: flex; justify-content: space-around; align-items: center;
    }
    .nav-item { color: #888; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item.active { color: white; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

<div class="upload-box">
  <h2>Sliderr Video Yükle</h2>
  <input type="file" id="videoInput" accept="video/*">
  <textarea id="descInput" placeholder="Açıklama veya #hashtag..."></textarea>
  <button onclick="uploadVideo()">Paylaş 🚀</button>
  <div id="status"></div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Akış</a>
  <a href="upload.html" class="nav-item active"><span class="nav-icon">➕</span>Yükle</a>
  <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>Profil</a>
</nav>

<script>
  const currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
  if (!currentUser) window.location.href = "auth.html";

  const CLOUD_NAME = "v8lpa3zs"; 
  const UPLOAD_PRESET = "ivbsr6gn";

  async function uploadVideo() {
    const fileInput = document.getElementById('videoInput');
    const descInput = document.getElementById('descInput');
    const status = document.getElementById('status');
    
    if (!fileInput.files[0]) {
      alert("Lütfen bir video seçin!");
      return;
    }

    status.innerText = "Video işleniyor...";

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('upload_preset', UPLOAD_PRESET);

    try {
      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
        method: 'POST', body: formData
      });
      const data = await response.json();

      if (data.secure_url) {
        status.innerText = "Sliderr'a kaydediliyor...";

        await db.collection("reels").add({
          url: data.secure_url,
          desc: descInput.value,
          username: currentUser.username,
          avatar: currentUser.avatar,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        status.innerText = "Yüklendi! Yönlendiriliyorsunuz...";
        setTimeout(() => window.location.href = "index.html", 1000);
      }
    } catch (err) {
      status.innerText = "Yükleme hatası oluştu!";
    }
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sliderr - Video Yükle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #000; 
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 20px; 
      padding-bottom: 80px; 
    }

    .upload-card { 
      width: 100%; 
      max-width: 400px; 
      background: #111; 
      padding: 24px; 
      border-radius: 16px; 
      border: 1px solid #222; 
      text-align: center; 
    }

    h2 { margin-bottom: 20px; color: #ff007f; }

    .file-input-label { 
      display: block; 
      border: 2px dashed #333; 
      padding: 30px; 
      border-radius: 12px; 
      cursor: pointer; 
      margin-bottom: 16px; 
      transition: border-color 0.2s; 
    }
    .file-input-label:hover { border-color: #ff007f; }
    input[type="file"] { display: none; }

    textarea { 
      width: 100%; 
      background: #1a1a1a; 
      border: 1px solid #333; 
      color: white; 
      padding: 12px; 
      border-radius: 8px; 
      resize: none; 
      height: 80px; 
      margin-bottom: 16px; 
      outline: none; 
      font-family: inherit;
    }
    textarea:focus { border-color: #ff007f; }

    button { 
      width: 100%; 
      background: #ff007f; 
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 15px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg { margin-top: 15px; font-size: 13px; color: #888; }

    /* Standart Alt Navigasyon Barı */
    .navbar { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 60px; 
      background: rgba(0, 0, 0, 0.95); 
      border-top: 1px solid #222; 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      z-index: 100; 
    }
    .nav-item { 
      color: #888; 
      text-decoration: none; 
      font-size: 11px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 3px; 
    }
    .nav-item.active { color: #ff007f; font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>

  <!-- Firebase SDK Kütüphaneleri -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>

  <div class="upload-card">
    <h2>Yeni Video Paylaş</h2>

    <label class="file-input-label" for="videoFile">
      <span id="fileLabelText">📁 Bir video seç veya sürükle</span>
    </label>
    <input type="file" id="videoFile" accept="video/*" onchange="handleFileSelect(event)">

    <textarea id="captionInput" placeholder="Açıklama veya hashtag ekle..."></textarea>
    <button id="uploadBtn" onclick="uploadVideo()">Paylaş</button>
    
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <!-- Standart Alt Navigasyon Barı -->
  <nav class="navbar">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Akış</span></a>
    <a href="search.html" class="nav-item"><span class="nav-icon">🔍</span><span>Keşfet</span></a>
    <a href="upload.html" class="nav-item active"><span class="nav-icon">➕</span><span>Yükle</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('sliderr_user'));
    if (!currentUser) {
      window.location.href = "auth.html";
    }

    let selectedFile = null;

    function handleFileSelect(e) {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        document.getElementById('fileLabelText').innerText = `✅ Seçildi: ${selectedFile.name.substring(0, 20)}...`;
      }
    }

    async function uploadVideo() {
      const btn = document.getElementById('uploadBtn');
      const statusMsg = document.getElementById('statusMsg');
      const caption = document.getElementById('captionInput').value.trim();

      if (!selectedFile) {
        alert("Lütfen yüklemek için önce bir video dosyası seçin.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Yükleniyor...";
      statusMsg.innerText = "Video Cloudinary'ye aktarılıyor, lütfen bekleyin...";

      const formData = new FormData();
      formData.append("file", selectedFile);
      // Yeni sıfır Unsigned preset ismin:
      formData.append("upload_preset", "sliderr_v2"); 

      try {
        // Cloud Name: v8lpa3zs
        const res = await fetch("https://api.cloudinary.com/v1_1/v8lpa3zs/video/upload", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (res.status === 401) {
          throw new Error("Cloudinary yetkilendirme hatası (401). Preset adının 'sliderr_v2' ve Unsigned olduğundan emin olun.");
        }

        if (data.secure_url) {
          statusMsg.innerText = "Video yüklendi! Veritabanına kaydediliyor...";

          await db.collection("reels").add({
            videoUrl: data.secure_url,
            caption: caption,
            authorUid: currentUser.uid,
            authorName: currentUser.username,
            authorAvatar: currentUser.avatar,
            likes: [],
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          window.location.href = "index.html";
        } else {
          throw new Error(data.error ? data.error.message : "Video URL alınamadı.");
        }
      } catch (err) {
        console.error("Yükleme Hatası:", err);
        alert("Hata oluştu: " + err.message);
        statusMsg.innerText = "Yükleme başarısız oldu.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Paylaş";
      }
    }
  </script>
</body>
</html>
